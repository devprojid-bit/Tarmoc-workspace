<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>TARMOC Workspace — Central Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
/* anti-flash: terapkan tema sebelum CSS dirender */
try{var _t=localStorage.getItem('tarmoc_theme');
if(_t){document.documentElement.setAttribute('data-theme',_t)}
else if(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark')}
}catch(e){}
</script>
<style>
:root{
  color-scheme:light;
  --paper:#F5F4EE; --surface:#FFFFFF; --ink:#1B1A14; --ink2:#6E6A5C; --ink3:#9B977F;
  --line:#E7E4D8; --line2:#DAD6C8;
  --hover:#F2F0E7; --soft:#F1EFE6; --soft2:#FAF9F3; --rowh:#FBFAF5; --sk:#E9E6DA;
  --topbg:rgba(245,244,238,.86);
  --spruce:#1D5C48; --spruce-deep:#12432F; --spruce-soft:#E7EFE9;
  --amber:#A8742A; --amber-soft:#F5EBD6;
  --red:#B3402E; --red-soft:#F6E4DF;
  --side:#161510; --side-txt:#E9E7DB; --side-dim:#8F8C77;
  --brand:#F2C10E; --brand-strong:#D9A90B; --brand-ink:#1B1403;
  --brand-soft:rgba(242,193,14,.15); --brand-text:#8A6508;
  --disp:'Bricolage Grotesque',serif; --body:'Instrument Sans',sans-serif; --mono:'JetBrains Mono',monospace;
  --r-lg:18px; --r-md:12px; --r-sm:10px;
  --sh-sm:0 1px 2px rgba(24,21,12,.05),0 1px 6px rgba(24,21,12,.04);
  --sh-md:0 4px 12px rgba(24,21,12,.06),0 16px 40px -18px rgba(24,21,12,.18);
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#14120C; --surface:#1D1A12; --ink:#F2EFE1; --ink2:#B3AD93; --ink3:#807A60;
  --line:#2C2819; --line2:#3A3522;
  --hover:#262217; --soft:#262217; --soft2:#211E14; --rowh:#242015; --sk:#2A261A;
  --topbg:rgba(20,18,12,.84);
  --side:#0E0D08;
  --brand-soft:rgba(242,193,14,.12); --brand-text:#F5C51D;
  --sh-sm:0 1px 2px rgba(0,0,0,.45),0 1px 8px rgba(0,0,0,.3);
  --sh-md:0 8px 14px rgba(0,0,0,.4),0 18px 44px -16px rgba(0,0,0,.6);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
h1,h2,h3,h4{font-family:var(--disp);letter-spacing:-.01em;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::selection{background:var(--brand-soft)}
a{color:inherit}

/* ---------- umum ---------- */
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);transition:.15s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;font-weight:600;font-size:13.5px;transition:.18s;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:var(--brand-strong);transform:translateY(-1px)}
.btn-ghost{border-color:var(--line2);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink3);background:var(--soft2)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#96341F}
.btn-soft{background:var(--brand-soft);color:var(--brand-text)}
.btn-soft:hover{background:var(--brand);color:var(--brand-ink)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.5;pointer-events:none}
.input,.select{width:100%;padding:10px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);transition:.15s;outline:none}
.input:focus,.select:focus{border-color:#C9A40E;box-shadow:0 0 0 3px rgba(242,193,14,.22)}
.label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.err{color:var(--red);font-size:12.5px;margin-top:6px;display:none}
.err.show{display:block}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.b-green{background:var(--spruce-soft);color:var(--spruce-deep)}
.b-gray{background:#ECEAE0;color:var(--ink2)}
.b-amber{background:var(--amber-soft);color:#7C5514}
.b-red{background:var(--red-soft);color:#8C2E1D}
[data-theme="dark"] .b-green{background:rgba(61,153,112,.16);color:#86D9B4}
[data-theme="dark"] .b-gray{background:rgba(255,255,255,.09);color:#B9B49C}
[data-theme="dark"] .b-amber{background:rgba(242,193,14,.12);color:#F0CE55}
[data-theme="dark"] .b-red{background:rgba(179,64,46,.22);color:#F0A091}
.dot{width:7px;height:7px;border-radius:50%;background:var(--spruce);flex:none}
.dot.off{background:#C6C2B0}
[data-theme="dark"] .dot.off{background:#4A4531}
.kbd{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;background:var(--soft2);color:var(--ink2)}
.mono{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.mut{color:var(--ink2)}.mut3{color:var(--ink3)}
.urlchip svg{width:12px;height:12px;flex:none}

/* ---------- monogram & avatar ---------- */
.monogram{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font:700 19px/1 var(--disp);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),var(--sh-sm)}
.mono-sm{width:27px;height:27px;border-radius:8px;font-size:11.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12.5px var(--body);flex:none}
.avatar-lg{width:56px;height:56px;font-size:19px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{background:var(--side);color:var(--side-txt);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.sb-brand{padding:22px 20px 14px;display:flex;align-items:center;gap:12px}
.sb-brand .mark{color:var(--brand);display:flex}
.sb-brand .txt b{font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:.12em;display:block;color:var(--brand);line-height:1.1}
.sb-brand .txt span{font-size:9px;font-weight:600;letter-spacing:.16em;color:var(--side-dim)}
.sb-fold{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 20px 4px;padding:7px;border-radius:10px;color:var(--side-dim);border:1px solid rgba(255,255,255,.08);transition:.15s;width:calc(100% - 40px)}
.sb-fold:hover{color:#fff;background:rgba(255,255,255,.06)}
.sb-fold svg{width:15px;height:15px}
.sb-fold .flbl{font-size:11.5px;font-weight:600;letter-spacing:.04em}
.sb-nav{flex:1;overflow-y:auto;padding:10px 12px}
.sb-sec{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--side-dim);text-transform:uppercase;padding:16px 12px 7px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:9.5px 12px;border-radius:10px;color:#C9C6B4;font-weight:500;font-size:13.5px;transition:.15s;position:relative;text-align:left}
.sb-item svg{width:17px;height:17px;flex:none;opacity:.85}
.sb-item .lbl{flex:1;min-width:0}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.on{background:rgba(255,255,255,.09);color:#fff}
.sb-item.on::before{content:'';position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.sb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;transition:.15s;width:100%;text-align:left;position:relative}
.sb-user:hover{background:rgba(255,255,255,.06)}
.sb-user .who{min-width:0;flex:1;text-align:left}
.sb-user .who b{display:block;font-size:13px;color:#fff;font-weight:600}
.sb-user .who span{font-size:11.5px;color:var(--side-dim)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--topbg);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;height:64px}
#view{width:100%;max-width:1440px;margin:0 auto;padding:34px 40px 70px;display:flex;flex-direction:column;flex:1}

/* ---------- collapse (desktop) ---------- */
@media(min-width:901px){
  .shell{transition:grid-template-columns .28s cubic-bezier(.2,.8,.3,1)}
  .shell.sb-min{grid-template-columns:76px 1fr}
  .sb-min .sb-brand{justify-content:center;padding:22px 8px 10px}
  .sb-min .sb-brand .txt{display:none}
  .sb-min .sb-fold{width:40px;margin:8px auto 2px}
  .sb-min .sb-fold .flbl{display:none}
  .sb-min .sb-sec{height:0;overflow:hidden;padding:6px 0 0}
  .sb-min .sb-item{justify-content:center;padding:11px 0;gap:0}
  .sb-min .sb-item .lbl{display:none}
  .sb-min .sb-user{justify-content:center;padding:9px 0}
  .sb-min .sb-user .who,.sb-min .sb-user .sb-out{display:none}
  .sb-min .sb-item:hover::after,.sb-min .sb-fold:hover::after,.sb-min .sb-user:hover::after{
    content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);
    background:var(--surface);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--sh-md);
    padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;white-space:nowrap;z-index:90;pointer-events:none}
}

/* ---------- dropdown ---------- */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-md);padding:6px;z-index:60;display:none;animation:pop .14s ease}
.menu.show{display:block}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8.5px 11px;border-radius:9px;font-size:13.5px;font-weight:500;text-align:left;transition:.12s}
.menu button svg{width:15px;height:15px;color:var(--ink2)}
.menu button:hover{background:var(--hover)}
.menu button.danger,.menu button.danger svg{color:var(--red)}
.menu button.danger:hover{background:var(--red-soft)}
.menu hr{border:none;border-top:1px solid var(--line);margin:6px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1}}
.notif-panel{width:330px;max-height:400px;overflow:auto}

/* ---------- search box ---------- */
.searchbox{display:flex;align-items:center;gap:10px;padding:8.5px 13px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--ink3);font-size:13.5px;width:340px;max-width:44vw;transition:.15s}
.searchbox:hover{border-color:var(--ink3);box-shadow:var(--sh-sm)}
.searchbox svg{width:16px;height:16px}
.searchbox span{flex:1;text-align:left}
.searchbox .kbd{margin-left:auto}

/* ---------- stats strip ---------- */
.stats{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow:hidden;flex-wrap:wrap}
.stat{flex:1;min-width:150px;padding:20px 24px;position:relative}
.stat+.stat::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:1px;background:var(--line)}
.stat b{font:700 30px/1.1 var(--disp);display:block;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:500}
.stat .up{font:600 12px var(--mono);color:var(--brand-text)}

/* ---------- app card ---------- */
.grid-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.app-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;transition:.22s cubic-bezier(.2,.7,.3,1);box-shadow:var(--sh-sm);position:relative}
.app-card:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--ink3)}
.ac-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ac-head .grow{flex:1}
.star{color:var(--ink3);transition:.18s}
.star:hover{color:var(--amber);transform:scale(1.12)}
.star.on{color:var(--amber)}
.star.on svg{fill:var(--amber)}
.app-card h3{font-size:17.5px;font-weight:700}
.app-card .desc{color:var(--ink2);font-size:13px;margin-top:3px;min-height:20px}
.ac-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:13px;margin-top:14px}
.ac-meta .role{font-weight:600;color:var(--brand-text);background:var(--brand-soft);padding:2px 8px;border-radius:99px;font-size:11px}
.ac-meta .ago{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.open-btn{margin-top:13px;width:100%;justify-content:center;border:1px solid var(--line2);background:var(--soft2);font-weight:600}
.open-btn:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* ---------- page ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-head h2{font-size:27px;font-weight:700}
.page-head p{color:var(--ink2);margin-top:4px;font-size:13.5px}
.crumb{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.05em;margin-bottom:8px;text-transform:uppercase}
.crumb em{font-style:normal;color:var(--brand-text)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;font-weight:700}
.card-b{padding:20px}
.fadeup{animation:fu .35s cubic-bezier(.2,.7,.3,1)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dash-2col{display:grid;grid-template-columns:1fr 350px;gap:22px;align-items:start;margin-top:24px}

/* ---------- feed ---------- */
.feed-item{display:flex;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-item:last-child{border-bottom:none}
.feed-ic{width:30px;height:30px;border-radius:9px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--ink2)}
.feed-ic svg{width:14.5px;height:14.5px}
.feed-item p{font-size:13px;line-height:1.45}
.feed-item time{font-family:var(--mono);font-size:10.5px;color:var(--ink3);white-space:nowrap}
.qa-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 20px;border-bottom:1px solid var(--line);text-align:left;font-weight:600;font-size:13.5px;transition:.14s}
.qa-item:last-child{border-bottom:none}
.qa-item svg:first-child{width:16px;height:16px;color:var(--brand-text)}
.qa-item .chev{margin-left:auto;width:15px;height:15px;color:var(--ink3);transition:.14s}
.qa-item:hover{background:var(--soft2)}
.qa-item:hover .chev{transform:translateX(3px);color:var(--brand-text)}

/* ---------- table ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:600;text-align:left;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--soft2);white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--rowh)}
.cell-user{display:flex;align-items:center;gap:11px}
.cell-user b{font-weight:600;display:block}
.cell-user span{font-size:12px;color:var(--ink2)}
.rowact{display:flex;gap:4px;justify-content:flex-end}

/* ---------- switch ---------- */
.switch{width:38px;height:22px;border-radius:99px;background:#D5D1C1;position:relative;transition:.2s;flex:none;display:inline-block}
[data-theme="dark"] .switch{background:#3A3522}
.switch::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--brand)}
.switch.on::after{left:19px}

/* ---------- tabs ---------- */
.tabs{display:inline-flex;background:var(--hover);border-radius:11px;padding:3px;gap:2px}
.tabs button{padding:7px 15px;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink2);transition:.15s}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-sm)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,20,13,.45);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fdin .18s ease}
[data-theme="dark"] .overlay{background:rgba(0,0,0,.62)}
@keyframes fdin{from{opacity:0}}
.modal{background:var(--surface);border-radius:20px;width:100%;max-width:540px;max-height:90vh;overflow:auto;box-shadow:var(--sh-md);animation:mup .22s cubic-bezier(.2,.8,.3,1)}
.modal-lg{max-width:660px}
@keyframes mup{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.modal-h h3{font-size:18px;font-weight:700}
.modal-b{padding:8px 24px 24px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 22px}

/* ---------- toast ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--sh-md);font-size:13.5px;font-weight:500;max-width:380px;animation:tin .28s cubic-bezier(.2,.8,.3,1)}
.toast svg{width:17px;height:17px;flex:none}
.toast.ok svg{color:var(--spruce)} .toast.err svg{color:var(--red)} .toast.warn svg{color:var(--brand-text)}
.toast.out{animation:tout .25s forwards}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}

/* ---------- skeleton ---------- */
.sk{background:var(--sk);border-radius:10px;animation:skp 1.1s ease-in-out infinite}
@keyframes skp{50%{opacity:.55}}

/* ---------- palette ---------- */
.pal-panel{background:var(--surface);border-radius:18px;width:100%;max-width:590px;box-shadow:var(--sh-md);overflow:hidden;align-self:flex-start;margin-top:11vh;animation:mup .2s ease}
.pal-in{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.pal-in svg{width:19px;height:19px;color:var(--ink3)}
.pal-in input{flex:1;border:none;outline:none;font-size:16px;background:none;font-family:var(--body);color:var(--ink)}
.pal-list{max-height:400px;overflow-y:auto;padding:8px}
.pal-g{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);padding:10px 12px 4px}
.pal-it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500}
.pal-it svg{width:16px;height:16px;color:var(--ink2);flex:none}
.pal-it small{margin-left:auto;color:var(--ink3);font-size:11.5px;font-weight:400}
.pal-it.act{background:var(--brand-soft)}
.pal-it.act svg{color:var(--brand-text)}
.pal-empty{padding:40px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ---------- launch overlay ---------- */
.launch{position:fixed;inset:0;background:var(--side);z-index:150;display:flex;align-items:center;justify-content:center;color:var(--side-txt);animation:fdin .25s}
.launch::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.launch-in{position:relative;text-align:center;width:min(430px,90vw)}
.launch-in .monogram{width:72px;height:72px;border-radius:20px;font-size:28px;margin:0 auto 18px}
.launch-in h2{font-size:26px;color:#fff}
.launch-in .url{font-family:var(--mono);font-size:12.5px;color:var(--side-dim);margin-top:5px}
.l-steps{text-align:left;margin:28px auto 0;max-width:320px}
.l-step{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:13.5px;color:var(--side-dim);opacity:0;transform:translateY(5px);transition:.4s}
.l-step.show{opacity:1;transform:none}
.l-step.done{color:#D7D5C6}
.l-step .sp{width:17px;height:17px;border:2px solid #4A483A;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;flex:none}
.l-step.done .sp{border:none;animation:none;background:var(--brand);position:relative;border-radius:50%}
.l-step.done .sp::after{content:'';position:absolute;left:5px;top:2.5px;width:4px;height:8px;border:solid #1B1403;border-width:0 2px 2px 0;transform:rotate(45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.l-bar{height:3px;background:rgba(255,255,255,.1);border-radius:99px;margin:26px auto 0;max-width:320px;overflow:hidden}
.l-bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .5s ease}
.l-final{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--brand);min-height:18px;word-break:break-all}
.l-done{margin-top:20px;display:flex;gap:10px;justify-content:center;opacity:0;transition:.4s;flex-wrap:wrap}
.l-done.show{opacity:1}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.lg-left{background:var(--side);color:var(--side-txt);padding:44px 52px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-left::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse at 30% 40%,#000 10%,transparent 70%)}
.lg-left>*{position:relative}
.lg-mid{margin:auto 0;max-width:480px}
.lg-mid h1{font-size:clamp(34px,4.2vw,52px);font-weight:800;color:#fff;letter-spacing:-.02em}
.lg-mid h1 em{font-style:normal;color:var(--brand)}
.lg-mid p{color:#A5A28B;margin-top:16px;font-size:15px;max-width:400px}
.lg-feats{margin-top:34px;display:flex;flex-direction:column;gap:13px}
.lg-feat{display:flex;gap:12px;align-items:center;font-size:13.5px;color:#C9C6B4}
.lg-feat .fi{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.07);display:grid;place-items:center;flex:none;color:var(--brand)}
.lg-feat .fi svg{width:15px;height:15px}
.lg-right{display:flex;align-items:center;justify-content:center;padding:36px 24px;background:var(--paper);position:relative}
.lg-card{width:100%;max-width:400px}
.lg-card h2{font-size:24px;font-weight:700}
.lg-card .sub{color:var(--ink2);margin:6px 0 24px;font-size:13.5px}
.lg-form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh-sm)}
.demo-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.demo-chip{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:8px 13px;font-size:12.5px;font-weight:600;transition:.15s;text-align:left}
.demo-chip:hover{border-color:#C9A40E;background:var(--brand-soft)}
.demo-chip small{display:block;font-weight:400;color:var(--ink3);font-size:10.5px}
.pw-wrap{position:relative}
.pw-wrap .icon-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- roles ---------- */
.roles-grid{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.role-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-bottom:1px solid var(--line);text-align:left;transition:.13s;border-left:3px solid transparent}
.role-item:hover{background:var(--soft2)}
.role-item.on{background:var(--brand-soft);border-left-color:var(--brand)}
.role-item b{font-size:14px;display:block}
.role-item small{color:var(--ink2);font-size:11.5px}
.role-item .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.perm-group{margin-bottom:18px}
.perm-group>h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-family:var(--mono);margin-bottom:8px}
.perm-row{display:flex;align-items:center;gap:12px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;transition:.13s;cursor:pointer}
.perm-row:hover{border-color:var(--ink3);background:var(--soft2)}
.perm-row.on{background:var(--brand-soft);border-color:rgba(242,193,14,.45)}
.perm-row input{width:16px;height:16px;accent-color:var(--brand-strong);flex:none}
.perm-row b{font-size:13.5px;font-weight:600}
.perm-row code{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.cb-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.cb-row:last-child{border-bottom:none}
.cb-row input{width:16px;height:16px;accent-color:var(--brand-strong)}

/* ---------- 403 & empty ---------- */
.n403{text-align:center;padding:80px 20px}
.n403 b{font:800 110px/1 var(--disp);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px var(--line2);display:block}
.n403 h2{font-size:24px;margin-top:6px}
.n403 p{color:var(--ink2);margin:10px auto 26px;max-width:380px}
.empty{text-align:center;padding:52px 20px;color:var(--ink2)}
.empty .ei{width:52px;height:52px;border-radius:15px;background:var(--soft);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink3)}
.empty .ei svg{width:22px;height:22px}
.empty b{font-family:var(--disp);font-size:16px;color:var(--ink)}
.empty p{font-size:13px;margin:5px auto 16px;max-width:300px}

/* ---------- responsive ---------- */
.only-m{display:none}
@media(max-width:1080px){
  .dash-2col{grid-template-columns:1fr}
  .roles-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:272px;transform:translateX(-100%);transition:.28s cubic-bezier(.2,.8,.3,1);box-shadow:var(--sh-md)}
  .sidebar.open{transform:none}
  .sb-backdrop{position:fixed;inset:0;background:rgba(20,18,10,.4);z-index:35;opacity:0;pointer-events:none;transition:.25s}
  .sb-backdrop.show{opacity:1;pointer-events:auto}
  .only-m{display:inline-flex}
  #view{padding:22px 18px 80px}
  .topbar{padding:0 16px}
  .searchbox span{display:none}
  .searchbox{width:40px;padding:9px}
  .searchbox .kbd{display:none}
  .login{grid-template-columns:1fr}
  .lg-left{display:none}
  .page-head h2{font-size:22px}
  .stat{min-width:calc(50% - 1px)}
}

/* =====================================================
   TARMOC WORKSPACE — Central Dashboard Multi Application
   Logo asli via file PNG (deteksi otomatis) + fallback SVG

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];

/* ---------- PENYIMPANAN AMAN (fallback memori) ---------- */
const store=(()=>{
  try{
    const t='__tarmoc_test__';
    localStorage.setItem(t,t);localStorage.removeItem(t);
    return localStorage;
  }catch(e){
    const m={};
    return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}};
  }
})();

   BRAND LOGO
   ── Cara memakai logo ASLI Anda (tanpa diubah):
   1. Simpan gambar logo (banteng + TARMOC + tagline) sebagai
      "logo-tarmoc.png"  → dipakai di sidebar & halaman login
   2. (Opsional) simpan kepala banteng saja sebagai
      "logo-mark.png"    → dipakai saat sidebar diciutkan & layar SSO
   Aplikasi mendeteksi file tsb OTOMATIS. Jika tidak ada,
   digambar SVG tiruan sebagai cadangan.
   Bisa juga diisi manual di bawah ini.
===================================================== */
const BRAND={img:'',mark:''};   // contoh: {img:'logo-tarmoc.png', mark:'logo-mark.png'}
const GOLD='#F2C10E';

/* deteksi otomatis file logo di folder yang sama */
(function probeBrand(){
  const lists=[
    ['img',['logo-tarmoc.png','logo-tarmoc.jpg','logo-tarmoc.jpeg','logo.png']],
    ['mark',['logo-mark.png','mark.png']]
  ];
  lists.forEach(([key,list])=>{
    let i=0;
    const next=()=>{
      if(i>=list.length)return;
      const f=list[i++],im=new Image();
      im.onload=()=>{BRAND[key]=f;
        try{if(key==='mark'&&window._fav)_fav.href=f}catch(e){}
        if($('#app')&&$('#app').children.length){session?renderShell():renderLogin()}};
      im.onerror=next;
      im.src=f;
    };
    next();
  });
})();

/* ---------- URL HELPERS ---------- */
const normUrl=u=>{
  u=(u||'').trim();
  if(!u)return'';
  if(/^[a-z][a-z0-9+.-]*:\/\//i.test(u))return u;
  if(/^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?(\/|$)/i.test(u))return'http://'+u;
  return'https://'+u;
};
const validUrl=u=>{try{const x=new URL(normUrl(u));return!!x.hostname}catch(e){return false}};
const dispUrl=u=>(u||'').replace(/^https?:\/\//i,'').replace(/\/$/,'');
function ssoToken(a,u){
  const ua=db.uas.find(x=>x.userId===u.id&&x.appId===a.id);
  const payload={app:a.code,user:u.email,role:ua?ua.roleId:null,exp:now()+300000};
  try{return btoa(JSON.stringify(payload)).replace(/=+$/,'')}catch(e){return'demo-token'}

function timeAgo(ts){
  const d=Math.floor((now()-ts)/1000);
  if(d<60)return'baru saja';
  if(d<3600)return Math.floor(d/60)+' mnt lalu';
  if(d<86400)return Math.floor(d/3600)+' jam lalu';
  return Math.floor(d/86400)+' hari lalu';
}

function filteredApps(tab,q){
  const u=me();
  let list=db.apps.filter(a=>a.status==='active'&&canAccess(u.id,a.id));
  if(tab==='fav')list=list.filter(a=>(db.favorites[u.id]||[]).includes(a.id));
  if(tab==='recent'){
    const ids=[...db.logs].filter(l=>l.userId===u.id&&l.action==='app.open').reverse().map(l=>l.appId);
    list=[...new Set(ids)].map(appOf).filter(Boolean).slice(0,8);
  }
  if(q)list=list.filter(a=>(a.name+a.desc+a.code+(a.url||'')).toLowerCase().includes(q.toLowerCase()));
  return list;
}

      <p class="err" id="f-app-err"></p>
    </div>

    <button class="btn btn-primary">${icon('check')}${isNew?'Simpan Aplikasi':'Perbarui'}</button></div>
  </form>`);
  const up=$('#f-app-url'),prev=$('#url-prev');

    const v=normUrl(up.value);
    prev.innerHTML=up.value.trim()
      ?`Akan dibuka di: <b style="color:var(--brand-text);font-family:var(--mono);font-size:11px">${esc(v)}</b>`
      :'Kosongkan bila aplikasi tidak punya alamat web.';
  };
  up.oninput=updPrev;updPrev();
  $('#f-app').onsubmit=e=>{
    e.preventDefault();
    const fd=new FormData(e.target),err=$('#f-app-err');
    const name=fd.get('name').trim(),code=fd.get('code').trim().toUpperCase();
    const rawUrl=fd.get('url').trim();
    if(!name||!code){err.textContent='Nama dan kode aplikasi wajib diisi.';err.classList.add('show');return}
    if(db.apps.some(x=>x.code===code&&x.id!==a.id)){err.textContent='Kode sudah dipakai aplikasi lain.';err.classList.add('show');return}
    if(rawUrl&&!validUrl(rawUrl)){err.textContent='URL tidak valid — contoh: appanda.com, https://appanda.com/kas, localhost:3000';err.classList.add('show');return}
    const url=normUrl(rawUrl);

      const id=uid('a');
      const color=colorFor(db.apps.length);
      db.apps.push({id,name,code,desc:fd.get('desc').trim(),url,cat:fd.get('cat'),order:+fd.get('order')||db.apps.length+1,status:fd.get('status'),color,createdAt:now()});

      [['Admin','Akses penuh aplikasi','*'],['Manager','Kelola operasional harian',['dashboard.view',ent+'.view',ent+'.create',ent+'.update','report.view']],['Viewer','Hanya melihat',['dashboard.view',ent+'.view','report.view']]]
        .forEach(r=>{const role={id:uid('r'),appId:id,name:r[0],desc:r[1],createdAt:now()};db.roles.push(role);
          db.rp[role.id]=r[2]==='*'?ids.slice():ids.filter(x=>{const p=db.perms.find(z=>z.id===x);return r[2].includes(p.code)})});
      const ar=appRoles(id).find(r=>r.name==='Admin');
      db.uas.push({id:uid('ua'),userId:'u1',appId:id,roleId:ar.id,status:'active',createdAt:now()});
      logAct('app.create',`Aplikasi ${name} ditambahkan ke workspace${url?' ('+dispUrl(url)+')':''}`,id);
      toast(`Aplikasi "${name}" berhasil ditambahkan${url?' — terhubung ke '+dispUrl(url):''}`);
    }else{
      Object.assign(appOf(a.id),{name,code,desc:fd.get('desc').trim(),url,cat:fd.get('cat'),order:+fd.get('order')||1,status:fd.get('status')});
      logAct('app.update',`Aplikasi ${name} diperbarui${url?' — URL: '+dispUrl(url):''}`,a.id);
      toast('Perubahan aplikasi tersimpan');
    }
    save();closeModal();renderShell();
  };
}

let palItems=[],palIdx=0;
function closePalette(){const p=$('#pal');if(p)p.remove()}
function buildPalItems(q){
  const u=me(),superu=isSuper();q=(q||'').toLowerCase();
  const nav=[['dashboard','layout-dashboard','Dashboard'],['myapps','layout-grid','Aplikasi Saya'],['settings','settings','Pengaturan']]
    .concat(superu?[['users','users','Pengguna'],['apps','layers','Kelola Aplikasi'],['roles','shield-check','Role & Permission'],['logs','scroll-text','Log Aktivitas']]:[]);
  let items=[];
  nav.filter(n=>n[2].toLowerCase().includes(q)).forEach(n=>items.push({g:'Navigasi',ic:n[1],label:n[2],sub:'Buka halaman',run:()=>go(n[0])}));
  db.apps.filter(a=>a.status==='active'&&canAccess(u.id,a.id)&&((a.name+a.code+(a.url||'')).toLowerCase().includes(q))).forEach(a=>
    items.push({g:'Aplikasi',mono:a,label:a.name,sub:a.url?dispUrl(a.url):a.code,run:()=>openLaunch(a)}));
  if(superu){
    db.apps.filter(a=>((a.name+a.code+(a.url||'')).toLowerCase().includes(q))).forEach(a=>
      items.push({g:'Aplikasi (kelola)',mono:a,label:a.name,sub:'Edit aplikasi',run:()=>appForm(a)}));
    db.users.filter(x=>(x.name+x.email).toLowerCase().includes(q)).forEach(x=>
      items.push({g:'Pengguna',av:x,label:x.name,sub:x.email,run:()=>accessForm(x)}));
    if('tambah aplikasi'.includes(q))items.push({g:'Tindakan',ic:'plus',label:'Tambah Aplikasi',sub:'Admin',run:()=>appForm(null)});
    if('tambah pengguna'.includes(q))items.push({g:'Tindakan',ic:'user-plus',label:'Tambah Pengguna',sub:'Admin',run:()=>userForm(null)});
  }
  if('gelap terang tema dark light'.includes(q))items.push({g:'Tindakan',ic:THEME==='dark'?'sun':'moon',label:'Ganti Tema',sub:THEME==='dark'?'Ke terang':'Ke gelap',run:()=>{closePalette();A_theme()}});
  if('keluar logout'.includes(q))items.push({g:'Tindakan',ic:'log-out',label:'Keluar',sub:'Akhir sesi',run:logout});
  return items;
}
function paintPal(){
  const list=$('#pal-list');if(!list)return;
  if(!palItems.length){list.innerHTML=`<div class="pal-empty">Tidak ada hasil. Coba kata kunci lain.</div>`;return}
  let g='',h='';
  palItems.forEach((it,i)=>{
    if(it.g!==g){g=it.g;h+=`<div class="pal-g">${g}</div>`}
    h+=`<div class="pal-it ${i===palIdx?'act':''}" data-pi="${i}">
      ${it.mono?monogram(it.mono,true):it.av?avatar(it.av):`<i data-lucide="${it.ic}"></i>`}
      <span>${esc(it.label)}</span><small>${esc(it.sub)}</small></div>`;
  });
  list.innerHTML=h;refreshIcons();
  $$('.pal-it',list).forEach(el=>el.onclick=()=>{closePalette();palItems[+el.dataset.pi].run()});
  const act=$('.pal-it.act',list);if(act)act.scrollIntoView({block:'nearest'});
}
function openPalette(){
  closePalette();
  const ov=document.createElement('div');ov.className='overlay';ov.id='pal';ov.style.alignItems='flex-start';
  ov.innerHTML=`<div class="pal-panel">
    <div class="pal-in">${icon('search')}<input id="pal-q" placeholder="Ketik untuk mencari aplikasi, pengguna, atau menu…" autofocus><span class="kbd">ESC</span></div>
    <div class="pal-list" id="pal-list"></div></div>`;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closePalette()});
  modalLayer.appendChild(ov);
  palItems=buildPalItems('');palIdx=0;paintPal();
  const inp=$('#pal-q');inp.focus();
  inp.oninput=()=>{palItems=buildPalItems(inp.value);palIdx=0;paintPal()};
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palItems.length-1);paintPal()}
    if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);paintPal()}
    if(e.key==='Enter'&&palItems[palIdx]){closePalette();palItems[palIdx].run()}
  };
}

   LAUNCH APLIKASI — SSO HANDOFF
===================================================== */
let launchTimers=[];
function closeLaunch(){const l=$('#launch');if(l){launchTimers.forEach(clearTimeout);launchTimers=[];l.remove()}}
function openLaunch(a){
  const u=me();
  if(!canAccess(u.id,a.id)){
    logAct('access.denied',`${u.name} mencoba membuka ${a.name} tanpa permission`,a.id);
    toast('403 Forbidden — Anda tidak memiliki akses ke aplikasi ini','err');return;
  }
  if(a.status!=='active'){toast(`Aplikasi "${a.name}" sedang dinonaktifkan`,'warn');return}
  closeLaunch();
  const target=normUrl(a.url);
  const steps=['Memverifikasi sesi pusat TARMOC','Memeriksa hak akses aplikasi','Menerbitkan token SSO',
               target?'Mengalihkan ke '+dispUrl(target):'Menyiapkan aplikasi internal'];
  const ov=document.createElement('div');ov.className='launch';ov.id='launch';
  ov.innerHTML=`<div class="launch-in">
    <div style="display:flex;justify-content:center;margin-bottom:14px">${brandMark(58,GOLD)}</div>
    ${monogram(a)}
    <h2>${esc(a.name)}</h2><div class="url">${target?esc(dispUrl(target))+' · SSO Handoff':'aplikasi internal · SSO Handoff'}</div>
    <div class="l-steps">${steps.map(s=>`<div class="l-step"><span class="sp"></span>${esc(s)}</div>`).join('')}</div>
    <div class="l-bar"><i class="lbar"></i></div>
    <div class="l-final lfinal"></div>
    <div class="l-done ldone">
      <button class="btn btn-ghost" data-act="launch-close" style="background:transparent;color:#C9C6B4;border-color:rgba(255,255,255,.25)">Kembali ke Workspace</button>
      ${target?`<button class="btn" data-act="launch-open" data-id="${a.id}" style="background:${GOLD};color:#1B1403">${icon('external-link')}Lanjutkan ke Aplikasi</button>`:''}
    </div>
  </div>`;
  document.body.appendChild(ov);
  logAct('app.open',`${u.name} membuka ${a.name}${target?' → '+dispUrl(target):''}`,a.id);
  const ua=db.uas.find(x=>x.userId===u.id&&x.appId===a.id);
  if(ua)ua.lastOpen=now();
  save();
  const ss=$$('.l-step',ov),bar=$('.lbar',ov),done=$('.ldone',ov),fin=$('.lfinal',ov);
  steps.forEach((_,i)=>launchTimers.push(setTimeout(()=>{
    for(let j=0;j<i;j++)ss[j]&&ss[j].classList.add('done');
    ss[i].classList.add('show');
    bar.style.width=Math.round(((i+1)/steps.length)*100)+'%';
  },450+i*560)));
  launchTimers.push(setTimeout(()=>{
    ss.forEach(s=>s.classList.add('done'));
    const tok=ssoToken(a,u);
    fin.textContent=target
      ?'→ '+target+(target.includes('?')?'&':'?')+'sso_token='+tok.slice(0,22)+'…'
      :'Aplikasi internal — URL eksternal belum diatur';
    done.classList.add('show');
  },450+steps.length*560));
}

    'close-modal':closeModal,
    'nav':()=>{ui.sideOpen=false;go(t.dataset.route)},
    'toggle-side':()=>{ui.sideOpen=!ui.sideOpen;$('.sidebar').classList.toggle('open',ui.sideOpen);$('.sb-backdrop').classList.toggle('show',ui.sideOpen)},
    'close-side':()=>{ui.sideOpen=false;$('.sidebar')?.classList.remove('open');$('.sb-backdrop')?.classList.remove('show')},
    'open-palette':openPalette,
    'open-help':openHelp,
    'logout':logout,
    'theme':A_theme,
    'sb-toggle':()=>{
      COLLAPSED=!COLLAPSED;
      try{store.setItem('tarmoc_sb',COLLAPSED?'1':'0')}catch(e){}
      $('.shell')?.classList.toggle('sb-min',COLLAPSED);
      const f=$('.sb-fold');
      if(f){f.innerHTML=icon(COLLAPSED?'chevrons-right':'chevrons-left')+'<span class="flbl">Ciutkan</span>';
        f.dataset.tip=COLLAPSED?'Perluas menu':'Ciutkan menu';refreshIcons()}
    },
    'mark-read':()=>{db.notifRead[me().id]=now();save();renderShell();toast('Notifikasi ditandai dibaca')},
    'open-app':()=>{const a=appOf(id);if(a)openLaunch(a)},
    'launch-close':()=>{closeLaunch();renderShell()},
    'launch-open':()=>{
      const a=appOf(id);if(!a)return;
      const target=normUrl(a.url);
      if(!target){toast('Aplikasi ini belum memiliki URL','warn');return}
      const sep=target.includes('?')?'&':'?';
      const finalUrl=target+sep+'sso_token='+ssoToken(a,me())+'&from=tarmoc';
      try{window.open(finalUrl,'_blank');toast('Token SSO diteruskan ke '+a.name)}
      catch(err){toast('Popup diblokir browser — salin URL dari layar launch','warn',6000)}
    },
    'copy-url':()=>{
      const a=appOf(id);if(!a||!a.url){toast('Aplikasi ini belum memiliki URL','warn');return}
      const txt=normUrl(a.url);
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(()=>toast('URL disalin: '+dispUrl(txt)))
          .catch(()=>toast('URL: '+txt,'warn',6000));
      }else toast('URL: '+txt,'warn',6000);
    },
    'fav':()=>{const u=me();db.favorites[u.id]=db.favorites[u.id]||[];const arr=db.favorites[u.id];
      const i=arr.indexOf(id);i>=0?arr.splice(i,1):arr.push(id);save();
      t.classList.toggle('on');if(ui.route==='myapps')paintMyApps();
      toast(i>=0?'Dihapus dari favorit':'Ditambahkan ke favorit')},
    'mytab':()=>{ui.myTab=t.dataset.t;renderShell()},
    'qa':()=>{const q=t.dataset.q;
      if(q.startsWith('nav:'))go(q.slice(4));
      else if(q==='add-app')appForm(null);
      else if(q==='add-user')userForm(null);
      else if(q==='qa-access')go('users');
      else if(q==='navf'){ui.myTab='fav';go('myapps')}
      else if(q.startsWith('open:')){const a=appOf(q.slice(5));if(a)openLaunch(a)}},
    'add-app':()=>appForm(null),
    'edit-app':()=>appForm(appOf(id)),
    'toggle-app':()=>{const a=appOf(id);a.status=a.status==='active'?'disabled':'active';
      logAct('app.status',`Aplikasi ${a.name} ${a.status==='active'?'diaktifkan':'dinonaktifkan'}`,a.id);save();
      toast(`Aplikasi "${a.name}" ${a.status==='active'?'diaktifkan':'dinonaktifkan'}`);renderShell()},
    'del-app':async()=>{const a=appOf(id);
      if(!await confirmDialog({title:'Hapus '+a.name+'?',desc:`Aplikasi, seluruh role, permission, dan akses pengguna pada <b>${esc(a.name)}</b> akan dihapus permanen. Tindakan ini tercatat di audit log.`}))return;
      const rids=appRoles(a.id).map(r=>r.id);
      db.rp=Object.fromEntries(Object.entries(db.rp).filter(([k])=>!rids.includes(k)));
      db.roles=db.roles.filter(r=>r.appId!==a.id);db.perms=db.perms.filter(p=>p.appId!==a.id);
      db.uas=db.uas.filter(x=>x.appId!==a.id);db.apps=db.apps.filter(x=>x.id!==a.id);
      Object.keys(db.favorites).forEach(k=>db.favorites[k]=db.favorites[k].filter(x=>x!==a.id));
      logAct('app.delete',`Aplikasi ${a.name} dihapus beserta seluruh konfigurasinya`);save();
      toast(`Aplikasi "${a.name}" dihapus`);renderShell()},
    'app-roles':()=>{ui.roleApp=id;ui.roleSel=null;go('roles')},
    'add-user':()=>userForm(null),
    'edit-user':()=>userForm(userOf(id)),
    'toggle-user':()=>{const u=userOf(id);u.status=u.status==='active'?'disabled':'active';
      logAct('user.status',`${u.name} ${u.status==='active'?'diaktifkan':'dinonaktifkan'}`);save();
      toast(`Pengguna "${u.name}" ${u.status==='active'?'diaktifkan':'dinonaktifkan'}`);renderShell()},
    'del-user':async()=>{const u=userOf(id);
      if(!await confirmDialog({title:'Hapus '+u.name+'?',desc:`Akun <b>${esc(u.name)}</b> beserta seluruh penugasan aksesnya akan dihapus permanen.`}))return;
      db.uas=db.uas.filter(x=>x.userId!==id);db.users=db.users.filter(x=>x.id!==id);
      delete db.favorites[id];
      logAct('user.delete',`Pengguna ${u.name} dihapus`);save();
      toast(`Pengguna "${u.name}" dihapus`);renderShell()},
    'access':()=>accessForm(userOf(id)),
    'reset-pass':async()=>{const u=userOf(id);
      if(!await confirmDialog({title:'Reset password?',desc:`Link reset akan dikirim ke <b>${esc(u.email)}</b> dan password saat ini ditandai kedaluwarsa.`,ok:'Kirim Reset',danger:false}))return;
      const tmp='tmp-'+Math.random().toString(36).slice(2,8);
      logAct('user.pass',`Password ${u.name} direset oleh admin`);save();
      toast(`Password sementara ${u.name}: ${tmp}`,'ok',6000)},
    'role-select':()=>{ui.roleSel=id;renderShell()},
    'add-role':()=>{if(!appOf(ui.roleApp)){toast('Tambahkan aplikasi terlebih dahulu','warn');return}
      openModal(`
      <div class="modal-h"><h3>Tambah Role — ${esc(appOf(ui.roleApp).name)}</h3><button class="icon-btn" data-act="close-modal">${icon('x')}</button></div>
      <form id="f-role"><div class="modal-b">
        <label class="label" style="margin-top:8px">Nama Role *</label><input class="input" name="name" placeholder="mis. Supervisor">
        <label class="label">Deskripsi</label><input class="input" name="desc" placeholder="Tanggung jawab role ini">
        <p class="err" id="f-role-err"></p></div>
      <div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close-modal">Batal</button>
      <button class="btn btn-primary">${icon('check')}Simpan Role</button></div></form>`);
      $('#f-role').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);
        const name=fd.get('name').trim();if(!name){$('#f-role-err').textContent='Nama role wajib diisi.';$('#f-role-err').classList.add('show');return}
        if(appRoles(ui.roleApp).some(r=>r.name.toLowerCase()===name.toLowerCase())){$('#f-role-err').textContent='Role dengan nama itu sudah ada.';$('#f-role-err').classList.add('show');return}
        const role={id:uid('r'),appId:ui.roleApp,name,desc:fd.get('desc').trim()||'—',createdAt:now()};
        db.roles.push(role);db.rp[role.id]=[];
        logAct('role.create',`Role ${name} dibuat pada ${appOf(ui.roleApp).name}`,ui.roleApp);save();
        ui.roleSel=role.id;closeModal();toast(`Role "${name}" dibuat`);renderShell()}},
    'del-role':async()=>{const role=roleById(id);
      const used=db.uas.filter(x=>x.roleId===id).length;
      if(used){toast(`Role "${role.name}" masih dipakai ${used} pengguna — cabut dulu penugasannya`,'err');return}
      if(!await confirmDialog({title:'Hapus role '+role.name+'?',desc:`Role beserta pemetaan permission-nya akan dihapus dari aplikasi ${esc(appOf(role.appId).name)}.`}))return;
      db.roles=db.roles.filter(r=>r.id!==id);delete db.rp[id];
      logAct('role.delete',`Role ${role.name} dihapus dari ${appOf(role.appId).name}`,role.appId);save();
      ui.roleSel=null;toast(`Role "${role.name}" dihapus`);renderShell()},
    'add-perm':()=>{if(!appOf(ui.roleApp)){toast('Tambahkan aplikasi terlebih dahulu','warn');return}
      openModal(`
      <div class="modal-h"><h3>Permission Baru — ${esc(appOf(ui.roleApp).name)}</h3><button class="icon-btn" data-act="close-modal">${icon('x')}</button></div>
      <form id="f-perm"><div class="modal-b">
        <label class="label" style="margin-top:8px">Kode Permission *</label><input class="input" name="code" placeholder="mis. order.export" style="font-family:var(--mono)">
        <label class="label">Nama / Label</label><input class="input" name="name" placeholder="Ekspor pesanan">
        <p class="err" id="f-perm-err"></p></div>
      <div class="modal-f"><button type="button" class="btn btn-ghost" data-act="close-modal">Batal</button>
      <button class="btn btn-primary">${icon('check')}Tambahkan</button></div></form>`);
      $('#f-perm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);
        const code=fd.get('code').trim().toLowerCase();
        if(!/^[a-z0-9]+\.[a-z0-9]+$/.test(code)){$('#f-perm-err').textContent='Format kode: modul.aksi (mis. order.export)';$('#f-perm-err').classList.add('show');return}
        if(appPerms(ui.roleApp).some(p=>p.code===code)){$('#f-perm-err').textContent='Kode permission sudah ada.';$('#f-perm-err').classList.add('show');return}
        db.perms.push({id:'p'+(++db.seq),appId:ui.roleApp,code,name:fd.get('name').trim()||code});
        logAct('perm.create',`Permission ${code} ditambahkan pada ${appOf(ui.roleApp).name}`,ui.roleApp);save();
        closeModal();toast(`Permission "${code}" ditambahkan`);renderShell()}},
    'reset-data':()=>{store.removeItem(DB_KEY);store.removeItem(SES_KEY);session=null;
      db=seedDB();save();closeModal();closePalette();ui.route='dashboard';renderLogin();toast('Data demo berhasil direset')},
  };
  try{A[act]?.()}catch(err){console.error(err);toast('Terjadi kesalahan: '+err.message,'err')}
});

/* ---------- change & input delegation ---------- */
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(!el)return;
  const k=el.dataset.change;
  if(k==='role-app'){ui.roleApp=el.value;ui.roleSel=null;renderShell()}
  if(k==='perm'){
    const rid=el.dataset.role,pid=el.dataset.perm;
    db.rp[rid]=db.rp[rid]||[];
    const has=db.rp[rid].includes(pid);
    if(el.checked&&!has)db.rp[rid].push(pid);
    if(!el.checked&&has)db.rp[rid]=db.rp[rid].filter(x=>x!==pid);
    const p=db.perms.find(x=>x.id===pid),role=roleById(rid);
    logAct('perm.update',`${el.checked?'Menambahkan':'Mencabut'} ${p.code} ${el.checked?'pada':'dari'} role ${role.name}`,p.appId);
    save();el.closest('.perm-row').classList.toggle('on',el.checked);
    toast(`${permLabel(p.code)} ${el.checked?'diizinkan':'dicabut'} untuk ${role.name}`);
  }
  if(k==='log-filter'){ui.logFilter=el.value;paintLogs()}
  if(k==='cat-filter'){ui.catF=el.value;paintAppsAdmin()}
  if(k==='twofa'){db.twoFA[me().id]=el.checked;save();
    toast(el.checked?'2FA diaktifkan — verifikasi kedua diminta saat masuk':'2FA dinonaktifkan')}
  if(k==='notifymail')toast('Preferensi notifikasi tersimpan');
});
document.addEventListener('input',e=>{
  if(e.target.id==='users-q'){ui.q.users=e.target.value;paintUsers()}
  if(e.target.id==='appadmin-q'){ui.q.adminapps=e.target.value;paintAppsAdmin()}
});

/* ---------- form: profile & password ---------- */
document.addEventListener('submit',e=>{
  if(e.target.id==='f-profile'){
    e.preventDefault();const fd=new FormData(e.target),u=me();
    const name=fd.get('name').trim(),email=fd.get('email').trim().toLowerCase();
    const err=$('#pf-err');
    if(!name||!email){err.textContent='Nama dan email wajib diisi.';err.classList.add('show');return}
    if(db.users.some(x=>x.email.toLowerCase()===email&&x.id!==u.id)){err.textContent='Email sudah dipakai pengguna lain.';err.classList.add('show');return}
    Object.assign(u,{name,email});
    logAct('profile.update',`${name} memperbarui profilnya`);save();
    toast('Profil tersimpan');renderShell();
  }
  if(e.target.id==='f-pass'){
    e.preventDefault();const fd=new FormData(e.target),u=me(),err=$('#pw-err');
    if(fd.get('cur')!==u.password){err.textContent='Password saat ini salah.';err.classList.add('show');return}
    if((fd.get('new')||'').length<6){err.textContent='Password baru minimal 6 karakter.';err.classList.add('show');return}
    if(fd.get('new')!==fd.get('conf')){err.textContent='Konfirmasi password tidak cocok.';err.classList.add('show');return}
    u.password=fd.get('new');logAct('user.pass',`${u.name} mengganti passwordnya`);save();
    toast('Password berhasil diganti');e.target.reset();
  }
});

/* ---------- INIT ---------- */
(function init(){
  const r=(location.hash||'#/dashboard').replace('#/','');
  ui.route=r||'dashboard';
  try{session?renderShell():renderLogin()}
  catch(err){
    document.body.innerHTML=`<div style="padding:40px;font-family:monospace"><b>Gagal memuat:</b><br>${esc(err.message)}<br><br>${esc(err.stack||'')}</div>`;
  }
})();
</script>
